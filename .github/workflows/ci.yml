name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and tests (Postgres + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      REQUIRE_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests (schema + every migration applied to a fresh database)
        run: pytest -v

  docker:
    name: Docker image builds and serves MCP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t shared-brain:ci .
      - name: Run with dummy credentials
        # the handshake and tools/list never reach Supabase or OpenAI
        run: |
          docker run -d --name sb -p 8000:8000 \
            -e SUPABASE_URL=http://localhost:54321 \
            -e SUPABASE_SERVICE_ROLE_KEY=ci.dummy.key \
            -e OPENAI_API_KEY=sk-ci-dummy \
            -e MCP_SECRET_PATH=ci-smoke \
            shared-brain:ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: MCP handshake and tools/list
        run: python tests/smoke_http.py http://localhost:8000/ci-smoke
      - name: Container logs
        if: always()
        run: docker logs sb
