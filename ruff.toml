target-version = "py312"
line-length = 120

[lint]
# Pinned explicitly so a newer ruff with different defaults does not break CI.
select = ["E", "F", "W", "I", "B", "UP"]

[lint.per-file-ignores]
# hooks/ run on the user's machines with whatever Python they have (macOS ships 3.9), not 3.12
"hooks/*" = ["UP"]
